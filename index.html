<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <meta name="description" content="ChurchConnect — Faith, Community &amp; Ministry. Connect with your church, explore sermons, events, and manage your ministry." />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#1b2a4a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ChurchConnect" />
  <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    html, body { min-height: 100%; margin: 0; background: #101827; }
    .app-loading-screen { position: fixed; inset: 0; z-index: 100000; display: grid; place-items: center; overflow: hidden; padding: 24px; color: #fff; background: radial-gradient(ellipse at 18% 18%, rgba(212,163,89,.22), transparent 42%), radial-gradient(ellipse at 84% 82%, rgba(100,219,232,.12), transparent 40%), linear-gradient(145deg,#101a30 0%,#1b2a4a 52%,#101827 100%); font-family: Arial,sans-serif; }
    .app-loading-glow { position:absolute; width:min(62vw,520px); aspect-ratio:1; border-radius:50%; filter:blur(70px); opacity:.35; pointer-events:none; }
    .app-loading-glow-one { top:-24%; left:-12%; background:rgba(212,163,89,.34); }
    .app-loading-glow-two { right:-18%; bottom:-30%; background:rgba(100,219,232,.25); }
    .app-loading-glass { width:min(100%,390px); box-sizing:border-box; display:flex; flex-direction:column; align-items:center; padding:42px 30px 36px; border:1px solid rgba(255,255,255,.20); border-radius:28px; background:rgba(255,255,255,.085); box-shadow:0 24px 80px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.14); -webkit-backdrop-filter:blur(24px) saturate(1.25); backdrop-filter:blur(24px) saturate(1.25); text-align:center; }
    .app-loading-mark { width:62px; height:62px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.32); border-radius:19px; background:linear-gradient(145deg,rgba(212,163,89,.95),rgba(212,163,89,.72)); box-shadow:0 10px 28px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.4); color:#1b2a4a; font-size:21px; font-weight:800; letter-spacing:-.06em; }
    .app-loading-eyebrow { margin:24px 0 0; color:rgba(255,255,255,.72); font-size:9px; font-weight:700; letter-spacing:.22em; }
    .app-loading-glass h1 { margin:7px 0 0; color:#fff; font-family:Georgia,serif; font-size:clamp(25px,6vw,31px); font-weight:600; letter-spacing:-.035em; }
    .app-loading-spinner { width:34px; height:34px; margin-top:30px; border:2px solid rgba(255,255,255,.18); border-top-color:#d4a359; border-right-color:rgba(212,163,89,.62); border-radius:50%; animation:app-loading-spin .85s linear infinite; }
    .app-loading-message { margin:14px 0 0; color:rgba(255,255,255,.88); font-size:12px; }
    .app-loading-footer { position:absolute; bottom:22px; left:16px; right:16px; color:rgba(255,255,255,.56); font-size:10px; letter-spacing:.06em; text-align:center; }
    @keyframes app-loading-spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .app-loading-spinner { animation-duration:2.5s; } }
  </style>
  <title>ChurchConnect — Faith, Community &amp; Ministry</title>
</head>

<body>
  <div id="root">
    <main class="app-loading-screen" role="status" aria-live="polite" aria-label="Loading ChurchConnect">
      <div class="app-loading-glow app-loading-glow-one"></div>
      <div class="app-loading-glow app-loading-glow-two"></div>
      <section class="app-loading-glass">
        <div class="app-loading-mark" aria-hidden="true">CC</div>
        <p class="app-loading-eyebrow">FAITH · COMMUNITY · MINISTRY</p>
        <h1>ChurchConnect</h1>
        <div class="app-loading-spinner" aria-hidden="true"><span></span></div>
        <p class="app-loading-message">Preparing your space…</p>
      </section>
      <p class="app-loading-footer">A place to connect, grow and serve together.</p>
    </main>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
